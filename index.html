<body>

  <header class="header">
    <div class="header__inner container stack">
      <h1 class="header__title">Our Pricing</h1>
      <div class="toggle-plan">
        <span>Annually</span>
        <label for="toggle" class="toggle-plan__switch">
          <input type="checkbox" name="toggle" id="toggle" role="switch" aria-label="Monthly billing" checked>
        </label>
        <span>Monthly</span>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <ul class="pricing-list" id="pricing-list">
      </ul>
    </div>
  </main>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pricing Component with Toggle | Frontend Mentor</title>

  <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
  <link rel="stylesheet" href="./styles/main.css">
  <script type="module" src="./scripts/main.js"></script>
</head>

<body>

  <header class="header">
    <div class="header__inner container stack">
      <h1 class="header__title">Our Pricing</h1>
      <div class="toggle-plan">
        <span>Annually</span>
        <label for="toggle" class="toggle-plan__switch">
          <input type="checkbox" name="toggle" id="toggle" role="switch" aria-label="Billing period" checked>
        </label>
        <span>Monthly</span>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <ul class="pricing-list" id="pricing-list">
      </ul>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io/challenges" target="_blank" rel="noopener noreferrer">Frontend
      Mentor</a> &ndash; Coded by <a href="https://www.frontendmentor.io/profile/vimpdev" target="_blank"
      rel="noopener noreferrer">VIMP</a>
  </footer>
</body>

</html>
